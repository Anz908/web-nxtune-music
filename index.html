<script id="nxperm-js">
/* Izin pertama supaya Dynamic Bar bisa tampil dinamis di Android (notifikasi lagu + pop-up melayang) */
(function(){

function T(m){try{toast(m)}catch(e){}}
function logged(){try{return !!LS.getItem('nxMzSess')}catch(e){return false}}
function done(){try{LS.setItem(FLAG,'1')}catch(e){}var d=document.getElementById('nxPm');if(d)d.remove()}
async function allow(){
var granted=false;

done();
if(granted)T('Dynamic bar aktif: notifikasi lagu dan pop-up melayang diizinkan');
else T('Notifikasi tidak diizinkan. Pop-up melayang tetap aktif, notifikasi bisa dinyalakan lewat Pengaturan');
